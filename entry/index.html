<!DOCTYPE html>
<html lang="en" data-theme="vscode">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal — cppup immersive entry</title>
<style>
:root,[data-theme="vscode"]{
  --bg:#0f1115;--panel:#151a20;--panel2:#1c242d;--border:rgba(255,255,255,0.12);
  --text:#edf4ff;--text-dim:#9ab0c4;--accent:#7cc6ff;--green:#9ae6b4;
  --yellow:#f7d08a;--orange:#ffb86c;--red:#ff6b6b;--purple:#c8a6ff;
  --focus:rgba(124,198,255,0.55);
  --room-wall:#d8d3ca;--room-floor:#9b8066;--desk-top:#8a6a4d;--lamp:#f8d996;
  --mountain-1:#cad9ea;--mountain-2:#98abc3;--mountain-3:#6e7d8d;--snow:#eef8ff;
  --ski-1:#f4d0a7;--ski-2:#7eb9f7;
}
[data-theme="dracula"]{
  --bg:#211f2f;--panel:#2d2b3b;--panel2:#3a384d;--border:rgba(255,255,255,0.12);
  --text:#f8f8f2;--text-dim:#b4b3c4;--accent:#bd93f9;--green:#50fa7b;
  --yellow:#f1fa8c;--orange:#ffb86c;--red:#ff5555;--purple:#ff79c6;
  --focus:rgba(189,147,249,0.55);
}
[data-theme="monokai"]{
  --bg:#1d1e1a;--panel:#2b2d27;--panel2:#35372e;--border:rgba(255,255,255,0.12);
  --text:#f8f8f2;--text-dim:#b8b7b1;--accent:#66d9e8;--green:#a6e22e;
  --yellow:#e6db74;--orange:#fd971f;--red:#f92672;--purple:#ae81ff;
  --focus:rgba(102,217,232,0.5);
}
[data-theme="solarized"]{
  --bg:#031c22;--panel:#0b2a32;--panel2:#123d47;--border:rgba(255,255,255,0.12);
  --text:#dfe9ea;--text-dim:#8ea5ad;--accent:#6ec6ff;--green:#90d97d;
  --yellow:#ecd088;--orange:#ef8d52;--red:#ff7b7b;--purple:#af9cff;
  --focus:rgba(110,198,255,0.5);
}
[data-theme="light"]{
  --bg:#f4f1eb;--panel:#fbfaf6;--panel2:#efe9df;--border:rgba(0,0,0,0.09);
  --text:#1f1f1f;--text-dim:#5c6570;--accent:#0070c1;--green:#2f7d5a;
  --yellow:#9a6a00;--orange:#b85514;--red:#c00000;--purple:#7b3f9e;
  --focus:rgba(0,112,193,0.3);
}

*,:before,:after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
a{color:inherit;text-decoration:none}
button{font:inherit}
.mono{font-family:'JetBrains Mono','Cascadia Code','Fira Code',Consolas,monospace}

.topnav{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:1rem;padding:0.75rem 1.2rem;background:rgba(21,26,32,0.8);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.nav-brand{font-weight:700;color:var(--accent)}
.nav-links{display:flex;gap:1rem;margin-left:auto}.nav-links a{color:var(--text-dim);font-size:0.9rem}
.nav-links a:hover{color:var(--text)}
.theme-switcher{display:flex;gap:0.35rem;margin-left:0.9rem}
.theme-btn{background:var(--panel2);border:1px solid var(--border);color:var(--text-dim);font-size:0.72rem;padding:0.2rem 0.45rem;border-radius:4px;cursor:pointer}
.theme-btn.active,.theme-btn:hover{color:var(--accent);border-color:var(--accent)}

.portal-wrap{max-width:1260px;margin:0 auto;padding:2rem 1.2rem 2.4rem}
.portal-head{margin-bottom:1.1rem}
.portal-title{margin:0;font-size:2rem;color:var(--accent)}
.portal-sub{margin:0.4rem 0 0;color:var(--text-dim);line-height:1.5}
.portal-hint{margin-top:0.6rem;font-size:0.88rem;color:var(--green)}

.scene-shell{position:relative;border-radius:16px;border:1px solid var(--border);background:linear-gradient(180deg,var(--panel2),var(--panel));overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,0.35)}
.scene-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:0.8rem 1rem;border-bottom:1px solid var(--border)}
.scene-head h2{margin:0;font-size:0.95rem;color:var(--text-dim)}
.scene-controls{display:flex;gap:0.6rem;align-items:center}.toggle-btn{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:0.26rem 0.7rem;border-radius:999px;cursor:pointer;transition:all .2s ease}
.toggle-btn:hover,.toggle-btn:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px var(--focus);outline:none}
.toggle-btn.is-active{background:var(--accent);color:#05131a;font-weight:700}

.scene-canvas{position:relative;width:100%;min-height:560px;overflow:hidden;perspective:1200px;transform-style:preserve-3d;isolation:isolate}
.scene-canvas[data-mode="quiet"] .active-layer{opacity:0;visibility:hidden}
.scene-canvas[data-mode="active"] .quiet-layer{opacity:0;visibility:hidden}
.scene-canvas:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 12%,rgba(255,255,255,0.12),transparent 20%),radial-gradient(circle at 80% 18%,rgba(124,198,255,0.22),transparent 22%)}

.layer{position:absolute;inset:0;transition:opacity 280ms ease,transform 280ms ease,visibility 280ms ease}
.scene-depth{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.fade{transition:opacity 280ms ease,transform 280ms ease,visibility 280ms ease}

.quiet-room{background:linear-gradient(180deg,#dfe5ec 0%,#c7d1db 12%,#ece8df 22%,#d7cab5 58%,#8d6f52 100%)}
.quiet-room .sky{position:absolute;inset:0;background:linear-gradient(180deg,#dfe8f4 0%,#dfe8f4 18%,rgba(255,255,255,0.2) 45%,transparent 100%)}
.quiet-room .mountains{position:absolute;left:0;right:0;bottom:22%;height:35%;background:linear-gradient(180deg,rgba(255,255,255,0));background-image:linear-gradient(135deg,transparent 0 34%, var(--mountain-1) 34% 52%, transparent 52%),linear-gradient(45deg,transparent 0 38%, var(--mountain-2) 38% 61%, transparent 61%),linear-gradient(180deg,transparent 0 65%,var(--mountain-3) 66%);opacity:.9}
.quiet-room .window{position:absolute;top:8%;left:12%;width:46%;height:44%;border:2px solid rgba(9,15,22,0.48);background:linear-gradient(180deg,rgba(178,218,255,.68),rgba(111,162,206,.3) 55%,rgba(55,78,94,.85) 100%);box-shadow:inset 0 0 0 8px rgba(255,255,255,.18),0 8px 18px rgba(0,0,0,.12);transform:translateZ(80px) rotateX(8deg)}
.quiet-room .window:before,.quiet-room .window:after{content:"";position:absolute;background:rgba(15,31,46,.35)}
.quiet-room .window:before{left:50%;top:0;width:2px;height:100%}
.quiet-room .window:after{left:0;top:50%;width:100%;height:2px}
.quiet-room .window-below{position:absolute;left:8%;bottom:18%;width:50%;height:18%;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.3));opacity:.7}
.quiet-room .desk{position:absolute;left:0;right:0;bottom:0;height:33%;background:linear-gradient(180deg,#caa57e,#8c6a4d 26%,#6d4f38 100%);box-shadow:inset 0 18px 30px rgba(255,255,255,.08);transform:translateZ(50px)}
.quiet-room .lamp{position:absolute;right:16%;bottom:22%;width:7%;height:32%;background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.05));border-radius:0 0 14px 14px;transform:translateZ(120px)}
.quiet-room .lamp::before{content:"";position:absolute;left:50%;top:-8%;width:16%;height:18%;transform:translateX(-50%);background:var(--lamp);border-radius:999px;box-shadow:0 0 16px rgba(255,217,129,.9)}
.quiet-room .monitor{position:absolute;left:16%;top:42%;width:28%;height:24%;background:linear-gradient(180deg,#0a1b28,#071923);border:2px solid rgba(255,255,255,.2);box-shadow:0 20px 26px rgba(0,0,0,.2),0 0 0 6px rgba(13,19,27,.2);transform:translateZ(110px)}
.quiet-room .monitor::before{content:"";position:absolute;left:50%;bottom:-22%;width:22%;height:20%;background:#1d2329;transform:translateX(-50%)}
.quiet-room .monitor::after{content:"";position:absolute;inset:10% 12% 16%;background:linear-gradient(180deg,rgba(124,198,255,.18),rgba(0,0,0,0));}
.quiet-room .keyboard{position:absolute;left:18%;top:66%;width:24%;height:8%;background:linear-gradient(180deg,#2e3238,#14181d);transform:skewX(-16deg) translateZ(120px)}
.quiet-room .book{position:absolute;left:36%;top:66%;width:17%;height:7%;background:linear-gradient(180deg,#f1e1bc,#ceb68e);border:1px solid rgba(0,0,0,.18);transform:rotate(-8deg) translateZ(120px)}
.quiet-room .object-arcade{position:absolute;right:20%;top:44%;width:18%;height:28%;background:linear-gradient(180deg,#42314d,#221d2d);border:1px solid rgba(255,255,255,0.12);border-radius:10px;transform:translateZ(110px) rotateY(-18deg)}
.quiet-room .object-arcade::before{content:"";position:absolute;left:10%;right:10%;top:14%;height:34%;background:linear-gradient(180deg,#1a6a9a,#0a2948);border:1px solid rgba(255,255,255,.3)}

.active-scene{background:linear-gradient(180deg,#8aa9ca 0%,#dfeffc 22%,#bfd9ec 40%,#a6beca 56%,#dfe6ef 100%) }
.active-scene .mountains{position:absolute;left:0;right:0;bottom:25%;height:38%;background:linear-gradient(180deg,rgba(255,255,255,0));background-image:linear-gradient(135deg,transparent 0 28%,var(--mountain-1) 28% 46%,transparent 46%),linear-gradient(35deg,transparent 0 34%,var(--mountain-2) 34% 58%,transparent 58%),linear-gradient(180deg,transparent 0 63%,var(--mountain-3) 64%);opacity:.95}
.active-scene .snowline{position:absolute;left:0;right:0;bottom:20%;height:16%;background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,.86));}
.active-scene .window{position:absolute;top:7%;left:12%;width:46%;height:44%;border:2px solid rgba(10,17,25,.52);background:linear-gradient(180deg,rgba(190,228,255,.75),rgba(84,115,150,.32) 58%,rgba(28,39,52,.9) 100%);box-shadow:inset 0 0 0 8px rgba(255,255,255,.18),0 10px 20px rgba(0,0,0,.15);transform:translateZ(75px) rotateX(8deg)}
.active-scene .window::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 25%,transparent 70%,rgba(0,0,0,.18));}
.active-scene .window::after{content:"";position:absolute;left:50%;top:0;height:100%;width:2px;background:rgba(15,31,46,.3)}
.active-scene .window .skiers{position:absolute;inset:0}
.active-scene .window .skier{position:absolute;bottom:14%;width:34px;height:18px;transform-origin:center;animation:skier-pass 10s linear infinite;}
.active-scene .window .skier::before{content:"";position:absolute;left:10px;top:0;width:10px;height:10px;border-radius:50%;background:#2f3d52;box-shadow:-8px 8px 0 0 var(--ski-1), 8px 9px 0 0 var(--ski-2);}
.active-scene .window .skier::after{content:"";position:absolute;left:0;top:10px;width:30px;height:4px;background:linear-gradient(90deg,var(--ski-2),var(--ski-1));border-radius:999px;box-shadow:0 0 0 1px rgba(0,0,0,.1);}
.active-scene .window .skier:nth-child(1){left:-10%;animation-delay:0s}
.active-scene .window .skier:nth-child(2){left:-16%;animation-delay:3.4s;transform:scale(.82)}
.active-scene .window .skier:nth-child(3){left:-18%;animation-delay:6.8s;transform:scale(.74)}
.active-scene .desk{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(180deg,#c59d76,#8d6a4d 28%,#604632 100%);box-shadow:inset 0 18px 30px rgba(255,255,255,.08);transform:translateZ(60px)}
.active-scene .lamp{position:absolute;right:16%;bottom:22%;width:7%;height:32%;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.08));border-radius:0 0 12px 12px;transform:translateZ(110px)}
.active-scene .lamp::before{content:"";position:absolute;left:50%;top:-8%;width:16%;height:18%;transform:translateX(-50%);background:var(--lamp);border-radius:999px;box-shadow:0 0 16px rgba(255,217,129,.9)}
.active-scene .monitor{position:absolute;left:16%;top:42%;width:28%;height:24%;background:linear-gradient(180deg,#0a1b28,#071923);border:2px solid rgba(255,255,255,.2);box-shadow:0 20px 26px rgba(0,0,0,.2),0 0 0 6px rgba(13,19,27,.2);transform:translateZ(100px)}
.active-scene .monitor::before{content:"";position:absolute;left:50%;bottom:-22%;width:22%;height:20%;background:#1d2329;transform:translateX(-50%)}
.active-scene .monitor::after{content:"";position:absolute;inset:10% 12% 16%;background:linear-gradient(180deg,rgba(124,198,255,.18),rgba(0,0,0,0));}
.active-scene .keyboard{position:absolute;left:18%;top:66%;width:24%;height:8%;background:linear-gradient(180deg,#2e3238,#14181d);transform:skewX(-16deg) translateZ(110px)}
.active-scene .book{position:absolute;left:36%;top:66%;width:17%;height:7%;background:linear-gradient(180deg,#f1e1bc,#ceb68e);border:1px solid rgba(0,0,0,.18);transform:rotate(-8deg) translateZ(110px)}
.active-scene .object-arcade{position:absolute;right:20%;top:44%;width:18%;height:28%;background:linear-gradient(180deg,#42314d,#221d2d);border:1px solid rgba(255,255,255,0.12);border-radius:10px;transform:translateZ(100px) rotateY(-18deg)}
.active-scene .object-arcade::before{content:"";position:absolute;left:10%;right:10%;top:14%;height:34%;background:linear-gradient(180deg,#1a6a9a,#0a2948);border:1px solid rgba(255,255,255,.3)}

.hotspot{position:absolute;display:inline-flex;align-items:center;gap:0.35rem;min-width:150px;padding:0.52rem 0.65rem;border-radius:12px;border:1px solid rgba(255,255,255,0.18);background:rgba(12,18,28,0.7);color:#f4f4f4;backdrop-filter:blur(2px);box-shadow:0 10px 18px rgba(0,0,0,.24);transform:translate(-50%,-50%);transition:transform 180ms ease,border-color 180ms ease,box-shadow 180ms ease,background 180ms ease}
.hotspot:hover,.hotspot:focus-visible{transform:translate(-50%,-55%);border-color:var(--accent);box-shadow:0 0 0 3px var(--focus),0 12px 22px rgba(0,0,0,.4);background:rgba(33,41,58,0.9);outline:none}
.hotspot:active{transform:translate(-50%,-50%) scale(0.97)}
.hotspot .hotspot-icon{font-size:1rem;line-height:1}
.hotspot .hotspot-text{display:flex;flex-direction:column}
.hotspot .hotspot-name{font-size:0.84rem;font-weight:600}
.hotspot .hotspot-desc{font-size:0.7rem;color:#dfe7f2}
.hotspot[data-depth="back"]{z-index:5}.hotspot[data-depth="mid"]{z-index:7}.hotspot[data-depth="front"]{z-index:9}

.hotspot-list{margin:0;padding:1rem 1rem 1rem 1.2rem;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0.75rem 1rem}
.hotspot-list li{line-height:1.45;color:var(--text-dim)}
.hotspot-list a{color:var(--accent)}
.mobile-portal{display:none}
.mobile-grid{display:grid;grid-template-columns:1fr;gap:0.75rem;padding-top:0.5rem}
.mobile-card{display:block;border:1px solid var(--border);border-radius:10px;background:var(--panel);padding:0.9rem}
.mobile-card:focus-visible,.mobile-card:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--focus);outline:none}
.mobile-title{display:flex;align-items:center;gap:0.45rem;font-weight:700;color:var(--text)}
.mobile-desc{margin-top:0.3rem;color:var(--text-dim);font-size:0.88rem}

footer{margin-top:2rem;padding:1.2rem;border-top:1px solid var(--border);text-align:center;font-size:0.8rem;color:var(--text-dim)}
footer a{color:var(--accent)}

@keyframes skier-pass{
  0% {transform:translate3d(-8vw, 0, 0) scale(0.76) rotate(-8deg)}
  20% {transform:translate3d(28vw, -10px, 0) scale(0.8) rotate(-6deg)}
  50% {transform:translate3d(48vw, -20px, 0) scale(0.9) rotate(-4deg)}
  100% {transform:translate3d(76vw, 4px, 0) scale(0.84) rotate(-2deg)}
}

@media (pointer: coarse){
  .scene-canvas{min-height:420px}
}
@media (max-width:960px){
  .nav-links{display:none}.portal-title{font-size:1.65rem}.scene-canvas{display:none}.hotspot-list{display:none}.mobile-portal{display:block}
}
@media (max-width:560px){
  .portal-wrap{padding:1.2rem 0.85rem 1.8rem}.topnav{padding:0.65rem 0.8rem}.theme-switcher{margin-left:auto}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important;scroll-behavior:auto !important}
}
</style>
</head>
<body>
<nav class="topnav">
  <a class="nav-brand mono" href="/">cppup_</a>
  <div class="nav-links">
    <a href="/">Home</a>
    <a href="/blog/">Blog</a>

    <a href="https://github.com/cppup" target="_blank" rel="noopener">GitHub</a>
  </div>

    <button class="theme-btn" data-t="monokai" title="Monokai">Mo</button>

    <button class="theme-btn" data-t="light" title="Light">☀</button>
  </div>
</nav>

<main class="portal-wrap">
  <header class="portal-head">
    <h1 class="portal-title mono">~/entry-portal</h1>
    <p class="portal-sub">
      Quiet mode until you choose the active scene. Explore the workspace and jump into the real content you care about.
    </p>
    <p class="portal-hint mono">Tip: Use <strong>Tab</strong> to cycle hotspots, then <strong>Enter</strong> to navigate.</p>
  </header>

  <section class="scene-shell" aria-labelledby="scene-title">
    <div class="scene-head">
      <h2 id="scene-title" class="mono">Interactive Desk Scene</h2>
      <div class="scene-controls mono" aria-label="Scene mode selector">
        <button class="toggle-btn is-active" type="button" data-scene-mode="quiet">Quiet</button>
        <button class="toggle-btn" type="button" data-scene-mode="active">Active</button>
      </div>
    </div>

    <div class="scene-canvas" id="scene-canvas" data-mode="quiet" aria-label="Desk scene with interactive hotspots"></div>

    <ol class="hotspot-list mono" id="hotspot-list" aria-label="Hotspot shortcuts list"></ol>

    <div class="mobile-portal" aria-label="Mobile entry list">
      <div class="mobile-grid" id="mobile-grid"></div>
    </div>
  </section>
</main>

<footer>

</footer>

<script src="/entry/scene-config.js"></script>
<script>
const THEME_KEY = 'cppup-theme';
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  localStorage.setItem(THEME_KEY, t);
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.t === t));
}
document.querySelectorAll('.theme-btn').forEach(b => b.addEventListener('click', () => applyTheme(b.dataset.t)));
applyTheme(localStorage.getItem(THEME_KEY) || 'vscode');

const sceneCfg = window.CPPUP_ENTRY_SCENE || { hotspots: [] };
const sceneCanvas = document.getElementById('scene-canvas');
const hotspotList = document.getElementById('hotspot-list');
const mobileGrid = document.getElementById('mobile-grid');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function buildSceneLayers(container) {
  const quietScene = document.createElement('div');
  quietScene.className = 'layer quiet-room quiet-layer';
  quietScene.innerHTML = `
    <div class="scene-depth">
      <div class="sky"></div>
      <div class="mountains"></div>
      <div class="window"></div>
      <div class="window-below"></div>
      <div class="desk"></div>
      <div class="lamp"></div>
      <div class="monitor"></div>
      <div class="keyboard"></div>
      <div class="book"></div>
      <div class="object-arcade"></div>
    </div>
  `;

  const activeScene = document.createElement('div');
  activeScene.className = 'layer active-scene active-layer';
  activeScene.innerHTML = `
    <div class="scene-depth">
      <div class="mountains"></div>
      <div class="snowline"></div>
      <div class="window">
        <div class="skiers">
          <div class="skier"></div>
          <div class="skier"></div>
          <div class="skier"></div>
        </div>
      </div>
      <div class="desk"></div>
      <div class="lamp"></div>
      <div class="monitor"></div>
      <div class="keyboard"></div>
      <div class="book"></div>
      <div class="object-arcade"></div>
    </div>
  `;

  container.appendChild(quietScene);
  container.appendChild(activeScene);
}

function createHotspotNode(hotspot) {
  const anchor = document.createElement('a');
  anchor.className = 'hotspot';
  anchor.href = hotspot.href;
  anchor.dataset.depth = hotspot.placement.depth;
  anchor.style.left = `${hotspot.placement.x}%`;
  anchor.style.top = `${hotspot.placement.y}%`;
  anchor.setAttribute('aria-label', `${hotspot.label}: ${hotspot.description}`);
  if (hotspot.external) {
    anchor.target = '_blank';
    anchor.rel = 'noopener';
  }

  const icon = document.createElement('span');
  icon.className = 'hotspot-icon';
  icon.textContent = hotspot.icon || '✦';

  const textWrap = document.createElement('span');
  textWrap.className = 'hotspot-text';

  const name = document.createElement('span');
  name.className = 'hotspot-name';
  name.textContent = hotspot.label;

  const desc = document.createElement('span');
  desc.className = 'hotspot-desc';
  desc.textContent = hotspot.description;

  textWrap.appendChild(name);
  textWrap.appendChild(desc);
  anchor.appendChild(icon);
  anchor.appendChild(textWrap);
  return anchor;
}

function renderScene() {
  buildSceneLayers(sceneCanvas);

  sceneCfg.hotspots.forEach((hotspot, index) => {
    const hotspotNode = createHotspotNode(hotspot);
    sceneCanvas.appendChild(hotspotNode);

    const li = document.createElement('li');
    const shortcut = document.createElement('a');
    shortcut.href = hotspot.href;
    shortcut.textContent = `${index + 1}. ${hotspot.label}`;
    if (hotspot.external) { shortcut.target = '_blank'; shortcut.rel = 'noopener'; }
    li.appendChild(shortcut);
    hotspotList.appendChild(li);

    const mobileCard = document.createElement('a');
    mobileCard.className = 'mobile-card';
    mobileCard.href = hotspot.href;
    mobileCard.innerHTML = `
      <div class="mobile-title"><span>${hotspot.icon || '✦'}</span><span>${hotspot.label}</span></div>
      <div class="mobile-desc">${hotspot.description}</div>
    `;
    if (hotspot.external) { mobileCard.target = '_blank'; mobileCard.rel = 'noopener'; }
    mobileGrid.appendChild(mobileCard);
  });
}

function setSceneMode(mode) {
  const buttons = document.querySelectorAll('.toggle-btn');
  buttons.forEach(btn => btn.classList.toggle('is-active', btn.dataset.sceneMode === mode));
  sceneCanvas.dataset.mode = mode;
}

function bindSceneControls() {
  const toggles = document.querySelectorAll('.toggle-btn');
  toggles.forEach(button => {
    button.addEventListener('click', () => setSceneMode(button.dataset.sceneMode));
  });
}

function enableArrowNavigation() {
  const interactive = Array.from(document.querySelectorAll('.hotspot'));
  if (!interactive.length) return;
  sceneCanvas.addEventListener('keydown', (event) => {
    const activeIndex = interactive.indexOf(document.activeElement);
    if (activeIndex < 0) return;
    if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
      event.preventDefault();
      interactive[(activeIndex + 1) % interactive.length].focus();
    } else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
      event.preventDefault();
      interactive[(activeIndex - 1 + interactive.length) % interactive.length].focus();
    }
  });
}

function enableParallax() {
  if (reduceMotion) return;
  let raf = null;
  const base = { x: 0, y: 0 };
  const onMove = (event) => {
    const x = (event.clientX / window.innerWidth - 0.5) * 20;
    const y = (event.clientY / window.innerHeight - 0.5) * 16;
    base.x = x;
    base.y = y;
    if (!raf) {
      raf = requestAnimationFrame(() => {
        sceneCanvas.style.transform = `rotateX(${(-base.y / 3).toFixed(2)}deg) rotateY(${(base.x / 3).toFixed(2)}deg)`;
        const quiet = sceneCanvas.querySelector('.quiet-layer .scene-depth');
        const active = sceneCanvas.querySelector('.active-layer .scene-depth');
        if (quiet) quiet.style.transform = `translate3d(${(base.x * 1.1).toFixed(2)}px, ${(base.y * 0.8).toFixed(2)}px, 0)`;
        if (active) active.style.transform = `translate3d(${(base.x * 1.2).toFixed(2)}px, ${(base.y * 0.9).toFixed(2)}px, 0)`;
        raf = null;
      });
    }
  };
  window.addEventListener('pointermove', onMove);
}

renderScene();
setSceneMode('quiet');
bindSceneControls();
enableParallax();
enableArrowNavigation();
</script>
</body>
</html>
