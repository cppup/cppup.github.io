<!DOCTYPE html>
<html lang="en" data-theme="vscode">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal — cppup immersive entry</title>
<style>
:root,[data-theme="vscode"]{
  --bg:#1e1e1e;--panel:#252526;--panel2:#2d2d30;--border:#3c3c3c;
  --text:#cccccc;--text-dim:#858585;--accent:#569cd6;--green:#4ec9b0;
  --yellow:#dcdcaa;--orange:#ce9178;--red:#f44747;--purple:#c586c0;
  --focus:rgba(86,156,214,0.5);
}
[data-theme="dracula"]{
  --bg:#282a36;--panel:#313442;--panel2:#44475a;--border:#6272a4;
  --text:#f8f8f2;--text-dim:#6272a4;--accent:#bd93f9;--green:#50fa7b;
  --yellow:#f1fa8c;--orange:#ffb86c;--red:#ff5555;--purple:#ff79c6;
  --focus:rgba(189,147,249,0.55);
}
[data-theme="monokai"]{
  --bg:#272822;--panel:#2c2d26;--panel2:#3e3d32;--border:#75715e;
  --text:#f8f8f2;--text-dim:#75715e;--accent:#66d9e8;--green:#a6e22e;
  --yellow:#e6db74;--orange:#fd971f;--red:#f92672;--purple:#ae81ff;
  --focus:rgba(102,217,232,0.5);
}
[data-theme="solarized"]{
  --bg:#002b36;--panel:#073642;--panel2:#0d3d4f;--border:#586e75;
  --text:#839496;--text-dim:#586e75;--accent:#268bd2;--green:#859900;
  --yellow:#b58900;--orange:#cb4b16;--red:#dc322f;--purple:#6c71c4;
  --focus:rgba(38,139,210,0.55);
}
[data-theme="light"]{
  --bg:#fffdf7;--panel:#f5f2ec;--panel2:#ede9e0;--border:#d4cfc5;
  --text:#3a3a3a;--text-dim:#8a8a8a;--accent:#0070c1;--green:#007f6e;
  --yellow:#967a00;--orange:#8b4513;--red:#c00000;--purple:#7b3f9e;
  --focus:rgba(0,112,193,0.45);
}

*,:before,:after{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
a{color:inherit;text-decoration:none}
.mono{font-family:'JetBrains Mono','Cascadia Code','Fira Code',Consolas,monospace}

.topnav{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;gap:1rem;
  padding:0.75rem 1.2rem;
  background:var(--panel);border-bottom:1px solid var(--border);
}
.nav-brand{font-weight:700;color:var(--accent)}
.nav-links{display:flex;gap:1rem;margin-left:auto}
.nav-links a{color:var(--text-dim);font-size:0.9rem}
.nav-links a:hover{color:var(--text)}
.theme-switcher{display:flex;gap:0.35rem;margin-left:0.9rem}
.theme-btn{
  background:var(--panel2);border:1px solid var(--border);color:var(--text-dim);
  font-size:0.72rem;font-family:'JetBrains Mono','Cascadia Code',Consolas,monospace;
  padding:0.2rem 0.45rem;border-radius:4px;cursor:pointer;
}
.theme-btn.active,.theme-btn:hover{color:var(--accent);border-color:var(--accent)}

.portal-wrap{max-width:1200px;margin:0 auto;padding:2rem 1.2rem 2.4rem}
.portal-head{margin-bottom:1.1rem}
.portal-title{margin:0;font-size:2rem;color:var(--accent)}
.portal-sub{margin:0.4rem 0 0;color:var(--text-dim);line-height:1.5}
.portal-hint{margin-top:0.6rem;font-size:0.88rem;color:var(--green)}

.scene-shell{
  position:relative;
  border-radius:14px;
  border:1px solid var(--border);
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  overflow:hidden;
  box-shadow:0 20px 48px rgba(0,0,0,0.35);
}

.scene-canvas{
  position:relative;
  width:100%;
  min-height:560px;
  perspective:980px;
  isolation:isolate;
}
.scene-canvas:after{
  content:"";
  position:absolute;inset:0;
  pointer-events:none;
  background:radial-gradient(circle at 80% 18%,rgba(86,156,214,0.25),transparent 42%),
    radial-gradient(circle at 28% 74%,rgba(78,201,176,0.2),transparent 40%);
}

.layer{position:absolute;pointer-events:none}
.layer.sky{
  inset:0;
  background:linear-gradient(180deg,rgba(50,95,145,0.55) 0%,rgba(30,50,80,0.25) 40%,transparent 60%);
}
.layer.window{
  top:8%;left:12%;width:48%;height:42%;
  border:2px solid rgba(255,255,255,0.22);
  background:linear-gradient(180deg,rgba(115,196,255,0.45),rgba(30,62,98,0.35));
  box-shadow:0 0 0 8px rgba(0,0,0,0.14);
  transform:rotateX(8deg);
}
.layer.window:before,.layer.window:after{
  content:"";position:absolute;background:rgba(255,255,255,0.2)
}
.layer.window:before{width:2px;height:100%;left:50%;top:0}
.layer.window:after{width:100%;height:2px;left:0;top:50%}
.layer.desk{
  left:0;right:0;bottom:0;height:46%;
  background:linear-gradient(180deg,#79533a,#65442f 36%,#4f3527);
  transform:rotateX(28deg) translateY(42px);
  transform-origin:bottom;
  border-top:1px solid rgba(255,255,255,0.16);
}
.layer.monitor{
  top:42%;left:14%;width:27%;height:20%;
  border:2px solid rgba(10,14,20,0.9);
  background:linear-gradient(180deg,#071f36,#0f2f4f);
  box-shadow:0 0 0 4px rgba(0,0,0,0.2),0 14px 24px rgba(0,0,0,0.32);
}
.layer.monitor:before{
  content:"";position:absolute;left:50%;bottom:-30%;width:22%;height:30%;
  background:#1e2329;transform:translateX(-50%);
}
.layer.keyboard{
  top:68%;left:17%;width:24%;height:8%;
  background:linear-gradient(180deg,#272a31,#15171d);
  border:1px solid rgba(255,255,255,0.18);
  transform:skewX(-16deg);
}
.layer.arcade{
  top:45%;right:20%;width:20%;height:30%;
  background:linear-gradient(180deg,#403048,#271f2e);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:8px;
  transform:rotateY(-15deg);
}
.layer.arcade:before{
  content:"";position:absolute;left:12%;right:12%;top:14%;height:35%;
  background:linear-gradient(180deg,#1f5f83,#13273e);
  border:1px solid rgba(255,255,255,0.28)
}
.layer.book{
  top:69%;left:34%;width:18%;height:6%;
  background:linear-gradient(180deg,#e5dabf,#cbbf9c);
  border:1px solid rgba(0,0,0,0.25);
  transform:rotate(-8deg);
}
.layer.cup{
  top:60%;right:33%;width:6%;height:12%;
  background:linear-gradient(180deg,#cfd4dd,#a5adbc);
  border-radius:0 0 10px 10px;
}

.hotspot{
  position:absolute;
  display:inline-flex;align-items:center;gap:0.35rem;
  min-width:150px;
  padding:0.52rem 0.65rem;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.18);
  background:rgba(18,21,29,0.75);
  color:#f4f4f4;
  backdrop-filter:blur(2px);
  box-shadow:0 8px 18px rgba(0,0,0,0.28);
  transform:translate(-50%,-50%);
  transition:transform 180ms ease,border-color 180ms ease,box-shadow 180ms ease,background 180ms ease;
}
.hotspot:hover,
.hotspot:focus-visible{
  transform:translate(-50%,-55%);
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--focus),0 12px 22px rgba(0,0,0,0.4);
  background:rgba(33,41,58,0.9);
  outline:none;
}
.hotspot:active{
  transform:translate(-50%,-50%) scale(0.97);
}
.hotspot-icon{font-size:1rem;line-height:1}
.hotspot-text{display:flex;flex-direction:column}
.hotspot-name{font-size:0.84rem;font-weight:600}
.hotspot-desc{font-size:0.7rem;color:#c7c7c7}
.hotspot[data-depth="back"]{z-index:5}
.hotspot[data-depth="mid"]{z-index:7}
.hotspot[data-depth="front"]{z-index:9}

.hotspot-list{
  margin:0;padding:1rem 1rem 1rem 1.2rem;
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:0.75rem 1rem;
}
.hotspot-list li{line-height:1.45;color:var(--text-dim)}
.hotspot-list a{color:var(--accent)}

.mobile-portal{display:none}
.mobile-grid{display:grid;grid-template-columns:1fr;gap:0.75rem;padding-top:0.5rem}
.mobile-card{
  display:block;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--panel);
  padding:0.9rem;
}
.mobile-card:focus-visible,
.mobile-card:hover{
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--focus);
  outline:none;
}
.mobile-title{display:flex;align-items:center;gap:0.45rem;font-weight:700;color:var(--text)}
.mobile-desc{margin-top:0.3rem;color:var(--text-dim);font-size:0.88rem}

footer{
  margin-top:2rem;padding:1.2rem;
  border-top:1px solid var(--border);
  text-align:center;font-size:0.8rem;color:var(--text-dim)
}
footer a{color:var(--accent)}

@media (max-width:960px){
  .nav-links{display:none}
  .portal-title{font-size:1.65rem}
  .scene-canvas{display:none}
  .hotspot-list{display:none}
  .mobile-portal{display:block}
}
@media (max-width:560px){
  .portal-wrap{padding:1.2rem 0.85rem 1.8rem}
  .topnav{padding:0.65rem 0.8rem}
  .theme-switcher{margin-left:auto}
}
</style>
</head>
<body>
<nav class="topnav">
  <a class="nav-brand mono" href="/">cppup_</a>
  <div class="nav-links">
    <a href="/">Home</a>
    <a href="/blog/">Blog</a>
    <a href="/games/">Games</a>
    <a href="https://github.com/cppup" target="_blank" rel="noopener">GitHub</a>
  </div>
  <div class="theme-switcher" aria-label="Theme switcher">
    <button class="theme-btn" data-t="vscode" title="VSCode Dark">VS</button>
    <button class="theme-btn" data-t="dracula" title="Dracula">Dr</button>
    <button class="theme-btn" data-t="monokai" title="Monokai">Mo</button>
    <button class="theme-btn" data-t="solarized" title="Solarized Dark">So</button>
    <button class="theme-btn" data-t="light" title="Light">☀</button>
  </div>
</nav>

<main class="portal-wrap">
  <header class="portal-head">
    <h1 class="portal-title mono">~/entry-portal</h1>
    <p class="portal-sub">
      A scene-driven entry prototype: explore the workspace, choose hotspots, jump to real content paths.
    </p>
    <p class="portal-hint mono">Tip: Use <strong>Tab</strong> to cycle hotspots, then <strong>Enter</strong> to navigate.</p>
  </header>

  <section class="scene-shell" aria-labelledby="scene-title">
    <h2 id="scene-title" class="mono" style="margin:0;padding:0.9rem 1rem;border-bottom:1px solid var(--border);font-size:0.95rem;color:var(--text-dim)">Interactive Desk Scene</h2>

    <div class="scene-canvas" id="scene-canvas" aria-label="Desk scene with interactive hotspots"></div>

    <ol class="hotspot-list mono" id="hotspot-list" aria-label="Hotspot shortcuts list"></ol>

    <div class="mobile-portal" aria-label="Mobile entry list">
      <div class="mobile-grid" id="mobile-grid"></div>
    </div>
  </section>
</main>

<footer>
  © 2026 cppup · Immersive portal prototype · <a href="https://github.com/cppup/cppup.github.io" target="_blank" rel="noopener">Source</a>
</footer>

<script src="/entry/scene-config.js"></script>
<script>
const THEME_KEY = 'cppup-theme';
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  localStorage.setItem(THEME_KEY, t);
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.t === t));
}
document.querySelectorAll('.theme-btn').forEach(b => b.addEventListener('click', () => applyTheme(b.dataset.t)));
applyTheme(localStorage.getItem(THEME_KEY) || 'vscode');

const sceneCfg = window.CPPUP_ENTRY_SCENE || { hotspots: [] };
const sceneCanvas = document.getElementById('scene-canvas');
const hotspotList = document.getElementById('hotspot-list');
const mobileGrid = document.getElementById('mobile-grid');

function buildSceneLayers(container) {
  const layers = ['sky', 'window', 'desk', 'monitor', 'keyboard', 'arcade', 'book', 'cup'];
  layers.forEach(name => {
    const layer = document.createElement('div');
    layer.className = `layer ${name}`;
    layer.setAttribute('aria-hidden', 'true');
    container.appendChild(layer);
  });
}

function createHotspotNode(hotspot) {
  const anchor = document.createElement('a');
  anchor.className = 'hotspot';
  anchor.href = hotspot.href;
  anchor.dataset.depth = hotspot.placement.depth;
  anchor.style.left = `${hotspot.placement.x}%`;
  anchor.style.top = `${hotspot.placement.y}%`;
  anchor.setAttribute('aria-label', `${hotspot.label}: ${hotspot.description}`);
  if (hotspot.external) {
    anchor.target = '_blank';
    anchor.rel = 'noopener';
  }

  const icon = document.createElement('span');
  icon.className = 'hotspot-icon';
  icon.textContent = hotspot.icon || '✦';

  const textWrap = document.createElement('span');
  textWrap.className = 'hotspot-text';

  const name = document.createElement('span');
  name.className = 'hotspot-name';
  name.textContent = hotspot.label;

  const desc = document.createElement('span');
  desc.className = 'hotspot-desc';
  desc.textContent = hotspot.description;

  textWrap.appendChild(name);
  textWrap.appendChild(desc);
  anchor.appendChild(icon);
  anchor.appendChild(textWrap);
  return anchor;
}

function renderScene() {
  buildSceneLayers(sceneCanvas);

  sceneCfg.hotspots.forEach((hotspot, index) => {
    sceneCanvas.appendChild(createHotspotNode(hotspot));

    const li = document.createElement('li');
    const shortcut = document.createElement('a');
    shortcut.href = hotspot.href;
    shortcut.textContent = `${index + 1}. ${hotspot.label}`;
    if (hotspot.external) {
      shortcut.target = '_blank';
      shortcut.rel = 'noopener';
    }
    li.appendChild(shortcut);
    hotspotList.appendChild(li);

    const mobileCard = document.createElement('a');
    mobileCard.className = 'mobile-card';
    mobileCard.href = hotspot.href;
    mobileCard.innerHTML = `
      <div class="mobile-title"><span>${hotspot.icon || '✦'}</span><span>${hotspot.label}</span></div>
      <div class="mobile-desc">${hotspot.description}</div>
    `;
    if (hotspot.external) {
      mobileCard.target = '_blank';
      mobileCard.rel = 'noopener';
    }
    mobileGrid.appendChild(mobileCard);
  });
}

function enableArrowNavigation() {
  const interactive = Array.from(document.querySelectorAll('.hotspot'));
  if (!interactive.length) return;

  sceneCanvas.addEventListener('keydown', (event) => {
    const activeIndex = interactive.indexOf(document.activeElement);
    if (activeIndex < 0) return;

    if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
      event.preventDefault();
      interactive[(activeIndex + 1) % interactive.length].focus();
    } else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
      event.preventDefault();
      interactive[(activeIndex - 1 + interactive.length) % interactive.length].focus();
    }
  });
}

renderScene();
enableArrowNavigation();
</script>
</body>
</html>
